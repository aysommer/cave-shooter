# Tests on every push; on main (or by hand) also builds the Docker images,
# pushes them to GitHub Container Registry and, if deployment is set up,
# updates the server. Setup: docs/DEPLOY.md, "Автообновление".

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build

  images:
    needs: test
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image names (lower case, as GHCR requires)
        id: names
        run: echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/cave-shooter-web:latest
            ghcr.io/${{ steps.names.outputs.owner }}/cave-shooter-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - uses: docker/build-push-action@v6
        with:
          context: ./server/signal
          push: true
          tags: |
            ghcr.io/${{ steps.names.outputs.owner }}/cave-shooter-signal:latest
            ghcr.io/${{ steps.names.outputs.owner }}/cave-shooter-signal:${{ github.sha }}
          cache-from: type=gha,scope=signal
          cache-to: type=gha,mode=max,scope=signal

  deploy:
    needs: images
    # Turned on by the repository variable DEPLOY_ENABLED=true.
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Update the server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd "${{ vars.DEPLOY_PATH || '/opt/cave-shooter' }}"
            git pull --ff-only
            docker compose pull
            docker compose up -d
            docker image prune -f
